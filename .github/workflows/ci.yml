name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

# Build backend
- name: Build backend image
  run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest ./backend

# Trivy scan backend
- name: Scan backend image with Trivy
  uses: aquasecurity/trivy-action@master
  with:
    image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest
    severity: HIGH,CRITICAL
    exit-code: 1

# Run backend tests
- name: Run backend tests
  run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest python -m pytest

# Push backend
- name: Push backend image
  run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest


# Build frontend
- name: Build frontend image
  run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest ./frontend

# ✅ Trivy scan FRONTEND (THIS WAS MISSING)
- name: Scan frontend image with Trivy
  uses: aquasecurity/trivy-action@master
  with:
    image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest
    severity: HIGH,CRITICAL
    exit-code: 1

# Push frontend
- name: Push frontend image
  run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest


      
   
