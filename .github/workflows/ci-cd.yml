name: Fully Automated CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
# ---------------- CI ----------------
  ci:
    name: Build, Test, Scan, Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend
      - name: Build backend image
        run: docker build -t dinnusaideep/capstone-backend:latest ./backend

      - name: Run backend tests
        run: docker run --rm dinnusaideep/capstone-backend:latest python -m pytest

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: dinnusaideep/capstone-backend:latest
          severity: HIGH,CRITICAL

      - name: Push backend image
        run: docker push dinnusaideep/capstone-backend:latest

      # Frontend
      - name: Build frontend image
        run: docker build -t dinnusaideep/capstone-frontend:latest ./frontend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: dinnusaideep/capstone-frontend:latest
          severity: HIGH,CRITICAL

      - name: Push frontend image
        run: docker push dinnusaideep/capstone-frontend:latest

# ---------------- DEV DEPLOY ----------------
  deploy-dev:
    name: Deploy to Development
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy DEV
        run: |
          cd ~/capstone-project
          git pull origin dev
          ./scripts/deploy.sh dev

# ---------------- STAGING DEPLOY ----------------
  deploy-staging:
    name: Deploy to Staging
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy STAGING
        run: |
          cd ~/capstone-project
          git pull origin main
          ./scripts/deploy.sh staging

# ---------------- PROD DEPLOY ----------------
  deploy-prod:
    name: Deploy to Production
    needs: ci
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy PROD
        run: |
          cd ~/capstone-project
          ./scripts/deploy.sh prod
