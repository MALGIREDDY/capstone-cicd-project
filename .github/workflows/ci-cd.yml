name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🔹 Build Backend Image
      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest ./backend

      # 🔹 Trivy Scan (THIS WILL RUN)
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest
          severity: HIGH,CRITICAL
          exit-code: 1

      # 🔹 Run Backend Tests
      - name: Run backend tests
        run: |
          docker run --rm \
            ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest \
            python -m pytest

      # 🔹 Build Frontend Image
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest ./frontend

      # 🔹 Push Images
      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest
