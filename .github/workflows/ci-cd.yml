name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ================= BACKEND =================

    - name: Build backend image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest ./backend

    - name: Trivy scan backend image
      uses: aquasecurity/trivy-action@master
      continue-on-error: true   # 👈 IMPORTANT
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest
        severity: HIGH,CRITICAL

    - name: Run backend tests
      run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest python -m pytest

    - name: Push backend image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstone-backend:latest

    # ================= FRONTEND =================

    - name: Build frontend image
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest ./frontend

    - name: Trivy scan frontend image
      uses: aquasecurity/trivy-action@master
      continue-on-error: true   # 👈 IMPORTANT
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest
        severity: HIGH,CRITICAL

    - name: Push frontend image
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/capstone-frontend:latest
