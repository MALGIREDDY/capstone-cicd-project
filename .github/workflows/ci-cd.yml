name: Fully Automated CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build, Test, Scan, Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------- BACKEND ----------
      - name: Build backend image
        run: docker build -t dinnusaideep/capstone-backend:latest ./backend

      - name: Run backend tests
        run: docker run --rm dinnusaideep/capstone-backend:latest python -m pytest

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: dinnusaideep/capstone-backend:latest
          severity: HIGH,CRITICAL

      - name: Push backend image
        run: docker push dinnusaideep/capstone-backend:latest

      # ---------- FRONTEND ----------
      - name: Build frontend image
        run: docker build -t dinnusaideep/capstone-frontend:latest ./frontend

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: dinnusaideep/capstone-frontend:latest
          severity: HIGH,CRITICAL

      - name: Push frontend image
        run: docker push dinnusaideep/capstone-frontend:latest

  deploy-staging:
    name: Auto Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci   # 🔥 THIS MAKES CD AUTOMATIC

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy on staging server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ~/capstone-project
            git pull origin main
            chmod +x scripts/*.sh
            ./scripts/deploy.sh staging
